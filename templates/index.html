<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Interview Coach</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0}
.box{max-width:700px;margin:auto;height:100vh;display:flex;flex-direction:column}
h2{background:#4f46e5;color:#fff;margin:0;padding:14px;text-align:center}
#chat{flex:1;overflow-y:auto;padding:12px}
.m{padding:10px 14px;margin:8px 0;border-radius:12px;max-width:80%;line-height:1.4}
.bot{background:#fff}
.user{background:#4f46e5;color:#fff;margin-left:auto}
.bar{display:flex;gap:8px;padding:10px;background:#fff}
input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px}
button{padding:12px 18px;background:#4f46e5;color:#fff;border:0;border-radius:8px}
</style>
</head>
<body>
<div class="box">
<h2>AI Interview Coach</h2>
<div id="chat"></div>
<div class="bar">
<input id="msg" placeholder="Type your answer...">
<button onclick="send()">Send</button>
</div>
</div>
<script>
const sid = crypto.randomUUID();
const chat = document.getElementById("chat");
const box = document.getElementById("msg");

function add(text, cls){
  const d = document.createElement("div");
  d.className = "m " + cls;
  d.innerHTML = text.replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/\\(.?)\\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function ask(text){
  const w = add("Typing...", "bot");
  try{
    const r = await fetch("/chat",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({session:sid,message:text})});
    const j = await r.json();
    w.remove(); add(j.reply,"bot");
  }catch(e){ w.remove(); add("Network error. Try again.","bot"); }
}

function send(){
  const t = box.value.trim();
  if(!t) return;
  add(t,"user"); box.value=""; ask(t);
}
box.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
ask("Hi, start the interview");
</script>
</body>
</html>
